name: Publish release images

# Builds every PgCloud image when a GitHub release is published and pushes it to Docker Hub
# tagged with the release version (and `latest` for stable releases).
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub user or organisation that owns the repositories
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
#
# Published images (<user> = DOCKERHUB_USERNAME):
#   <user>/pgcloud-db         PostgreSQL 16 node        (docker/db/Dockerfile)
#   <user>/pgcloud-pgpool     Pgpool-II node            (docker/pgpool/Dockerfile)
#   <user>/pgcloud-pgbouncer  PgBouncer node            (docker/pgbouncer/Dockerfile)
#   <user>/pgcloud-launcher   PgCloud Launcher web app  (tools/pgcloud-launcher/Dockerfile)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v1.0.0)
        required: true

permissions:
  contents: read

env:
  REF: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pgcloud-db
            file: docker/db/Dockerfile
          - image: pgcloud-pgpool
            file: docker/pgpool/Dockerfile
          - image: pgcloud-pgbouncer
            file: docker/pgbouncer/Dockerfile
          - image: pgcloud-launcher
            file: tools/pgcloud-launcher/Dockerfile

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          # v1.2.3 -> 1.2.3 and 1.2; `latest` only for stable (non pre-release) releases.
          tags: |
            type=semver,pattern={{version}},value=${{ env.REF }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.REF }}
            type=raw,value=${{ env.REF }},enable=${{ !startsWith(env.REF, 'v') }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ env.REF }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
