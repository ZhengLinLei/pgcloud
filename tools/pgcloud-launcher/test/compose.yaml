# Local playground for the PgCloud Launcher: the launcher + two fake servers (Docker-in-Docker + SSH).
#
#   docker compose -f tools/pgcloud-launcher/test/compose.yaml up -d --build
#   open http://localhost:8080        (admin password: launcher-test)
#
# Servers (SSH user root / password pgcloud-test):
#   srv-a  172.30.0.11
#   srv-b  172.30.0.12
#   srv-c  172.30.0.13
#   srv-d  172.30.0.14   (profile "extra": spare servers for backup nodes / fast-swap)
#   srv-e  172.30.0.15   (profile "extra")
# From the host: ssh -p 2211|2212|2213|2214|2215 root@localhost
#
# FOR TESTING ONLY: privileged containers, fixed passwords.
name: pgcloud-launcher-test

services:
  launcher:
    build:
      context: ../../..
      dockerfile: tools/pgcloud-launcher/Dockerfile
    image: pgcloud/launcher:dev
    environment:
      LAUNCHER_ADMIN_PASSWORD: launcher-test
    ports:
      - "${LAUNCHER_PORT:-8080}:8080"   # LAUNCHER_PORT=8081 if 8080 is taken
    volumes:
      - launcher-data:/data
    networks:
      lab:
        ipv4_address: 172.30.0.5

  srv-a:
    build:
      context: .
      dockerfile: testhost.Dockerfile
    image: pgcloud/testhost:dev
    hostname: srv-a
    privileged: true
    volumes:
      - srv-a-docker:/var/lib/docker
    ports:
      - "2211:22"
    networks:
      lab:
        ipv4_address: 172.30.0.11

  srv-b:
    build:
      context: .
      dockerfile: testhost.Dockerfile
    image: pgcloud/testhost:dev
    hostname: srv-b
    privileged: true
    volumes:
      - srv-b-docker:/var/lib/docker
    ports:
      - "2212:22"
    networks:
      lab:
        ipv4_address: 172.30.0.12

  srv-c:
    build:
      context: .
      dockerfile: testhost.Dockerfile
    image: pgcloud/testhost:dev
    hostname: srv-c
    privileged: true
    volumes:
      - srv-c-docker:/var/lib/docker
    ports:
      - "2213:22"
    networks:
      lab:
        ipv4_address: 172.30.0.13

  srv-d:
    profiles: [extra]   # ./RUN.dev.sh --extra: spare servers for backup nodes and fast-swap
    build:
      context: .
      dockerfile: testhost.Dockerfile
    image: pgcloud/testhost:dev
    hostname: srv-d
    privileged: true
    volumes:
      - srv-d-docker:/var/lib/docker
    ports:
      - "2214:22"
    networks:
      lab:
        ipv4_address: 172.30.0.14

  srv-e:
    profiles: [extra]   # ./RUN.dev.sh --extra: spare servers for backup nodes and fast-swap
    build:
      context: .
      dockerfile: testhost.Dockerfile
    image: pgcloud/testhost:dev
    hostname: srv-e
    privileged: true
    volumes:
      - srv-e-docker:/var/lib/docker
    ports:
      - "2215:22"
    networks:
      lab:
        ipv4_address: 172.30.0.15

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  launcher-data:
  srv-a-docker:
  srv-b-docker:
  srv-c-docker:
  srv-d-docker:
  srv-e-docker:
