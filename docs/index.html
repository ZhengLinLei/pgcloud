<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>PgCloud Launcher</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <script>
      // apply the theme before first paint
      try {
        var t = localStorage.getItem('pgl-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <script type="module" crossorigin src="./assets/index-Ce-j5oZc.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BnOBxheE.css">
  </head>

  </body>
</html>
